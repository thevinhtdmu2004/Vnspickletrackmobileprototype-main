name: CI/CD Pipeline to Docker Hub

# Kích hoạt pipeline mỗi khi có code push lên nhánh main
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Lấy code từ repository về máy ảo của GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Thiết lập môi trường Buildx để tối ưu hóa việc build Docker
      # (Hỗ trợ build đa nền tảng, cache tốt hơn)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Bước 3: Đăng nhập vào Docker Hub sử dụng Secrets đã cấu hình
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Bước 4: Build Docker Image và Push lên Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Đặt tên tag cho image của bạn (thay thế 'username_cua_ban' bằng tên Docker Hub thật)
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/vnspickletrack-app:latest
          ${{ secrets.DOCKER_USERNAME }}/vnspickletrack-app:${{ github.sha }}
        # Tối ưu hóa tốc độ build bằng cơ chế cache của GitHub
        cache-from: type=gha
        cache-to: type=gha,mode=max
